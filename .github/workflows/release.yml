name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # dry run: builds + smoke-checks, publishes nothing (guarded below)

permissions:
  contents: write # needed to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build fat jar + distribution
        run: ./gradlew --no-daemon shadowJar installDist distZip

      - name: Smoke check launcher
        run: ./build/install/jadx-headless-mcp/bin/jadx-headless-mcp --help

      - name: Smoke check fat jar
        run: java -jar build/libs/jadx-headless-mcp-*-all.jar --help

      # The plugin (.mcp.json) pins this jar's SHA-256; this prints it (CI log) and publishes it as
      # a release asset so the maintainer can copy it into .mcp.json. See PLUGIN.md.
      - name: Compute checksum
        run: |
          cd build/libs
          sha256sum jadx-headless-mcp-*-all.jar | tee jadx-headless-mcp.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/libs/jadx-headless-mcp-*-all.jar \
            build/libs/jadx-headless-mcp.sha256 \
            build/distributions/jadx-headless-mcp-*.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
